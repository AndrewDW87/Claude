<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROCUREMENT QUEST - A Civil Service Adventure</title>
<style>
  @font-face {
    font-family: 'ZXSpectrum';
    src: url('data:font/woff2;base64,') format('woff2');
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }

  #screen {
    width: 768px;
    height: 576px;
    background: #000;
    border: 32px solid #ccc;
    border-image: linear-gradient(135deg, #d4d4d4, #a0a0a0, #d4d4d4) 1;
    position: relative;
    overflow: hidden;
    image-rendering: pixelated;
  }

  #scanlines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.08) 2px,
      rgba(0, 0, 0, 0.08) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  #crt-flicker {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 99;
    animation: flicker 0.15s infinite;
    opacity: 0.02;
    background: #fff;
  }

  @keyframes flicker {
    0% { opacity: 0.02; }
    50% { opacity: 0.04; }
    100% { opacity: 0.02; }
  }

  #game-area {
    width: 100%;
    height: 100%;
    padding: 8px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
  }

  /* ZX Spectrum colours */
  .bright-black { color: #000; }
  .bright-blue { color: #0022c7; }
  .bright-red { color: #d62816; }
  .bright-magenta { color: #d433ff; }
  .bright-green { color: #00c525; }
  .bright-cyan { color: #00c7c9; }
  .bright-yellow { color: #ccc82a; }
  .bright-white { color: #cacaca; }

  .b-bright-black { color: #000; }
  .b-bright-blue { color: #002bfb; }
  .b-bright-red { color: #ff331c; }
  .b-bright-magenta { color: #ff40ff; }
  .b-bright-green { color: #00f92f; }
  .b-bright-cyan { color: #00fbfe; }
  .b-bright-yellow { color: #fffc36; }
  .b-bright-white { color: #ffffff; }

  .bg-blue { background-color: #002bfb; }
  .bg-red { background-color: #ff331c; }
  .bg-cyan { background-color: #00fbfe; }
  .bg-yellow { background-color: #fffc36; }
  .bg-green { background-color: #00f92f; }

  .text-content {
    font-family: monospace;
    font-size: 16px;
    line-height: 1.4;
    letter-spacing: 1px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  #header-bar {
    background: #002bfb;
    color: #ffffff;
    padding: 4px 8px;
    font-family: monospace;
    font-size: 14px;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 8px;
    font-weight: bold;
  }

  #phase-bar {
    background: #d62816;
    color: #fffc36;
    padding: 2px 8px;
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-align: center;
    margin-bottom: 8px;
    font-weight: bold;
  }

  #story-text {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    font-family: monospace;
    font-size: 15px;
    line-height: 1.5;
    color: #cacaca;
    scrollbar-width: thin;
    scrollbar-color: #002bfb #000;
  }

  #story-text::-webkit-scrollbar {
    width: 6px;
  }
  #story-text::-webkit-scrollbar-track {
    background: #000;
  }
  #story-text::-webkit-scrollbar-thumb {
    background: #002bfb;
  }

  #choices-area {
    padding: 8px;
    border-top: 2px solid #002bfb;
    min-height: 80px;
  }

  .choice-btn {
    display: block;
    width: 100%;
    background: #000;
    color: #00fbfe;
    border: 1px solid #002bfb;
    padding: 6px 12px;
    margin: 4px 0;
    font-family: monospace;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.1s, color 0.1s;
  }

  .choice-btn:hover {
    background: #002bfb;
    color: #ffffff;
  }

  .choice-btn:active {
    background: #ff331c;
    color: #ffffff;
  }

  .choice-key {
    color: #fffc36;
    font-weight: bold;
  }

  #stats-bar {
    display: flex;
    justify-content: space-between;
    padding: 4px 8px;
    background: #111;
    border-top: 1px solid #333;
    font-family: monospace;
    font-size: 11px;
    color: #00f92f;
    letter-spacing: 1px;
  }

  /* Loading screen */
  #loading-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .loading-stripes {
    width: 80%;
    height: 16px;
    margin: 2px 0;
    animation: load-stripe 2s ease-in-out;
    opacity: 0;
  }

  @keyframes load-stripe {
    0% { opacity: 0; width: 0; }
    50% { opacity: 1; width: 80%; }
    100% { opacity: 1; width: 80%; }
  }

  #loading-text {
    font-family: monospace;
    color: #cacaca;
    font-size: 14px;
    margin-top: 24px;
    letter-spacing: 2px;
  }

  .title-art {
    font-family: monospace;
    color: #fffc36;
    font-size: 13px;
    line-height: 1.1;
    text-align: center;
    white-space: pre;
    margin-bottom: 16px;
  }

  .typewriter {
    overflow: hidden;
    white-space: pre-wrap;
  }

  .cursor-blink {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: #cacaca;
    animation: blink 0.5s step-end infinite;
    vertical-align: text-bottom;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .highlight {
    color: #fffc36;
    font-weight: bold;
  }

  .warning {
    color: #ff331c;
  }

  .success {
    color: #00f92f;
  }

  .info {
    color: #00fbfe;
  }

  .dim {
    color: #666;
  }

  @keyframes borderFlash {
    0% { border-color: #ff331c; }
    25% { border-color: #002bfb; }
    50% { border-color: #00f92f; }
    75% { border-color: #fffc36; }
    100% { border-color: #ff331c; }
  }

  .flash-border {
    animation: borderFlash 2s linear infinite;
  }

  /* Responsive */
  @media (max-width: 832px) {
    #screen {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  }
</style>
</head>
<body>

<div id="screen">
  <div id="scanlines"></div>
  <div id="crt-flicker"></div>

  <div id="loading-screen">
    <div class="title-art" id="title-art"></div>
    <div id="loading-stripes-container"></div>
    <div id="loading-text">Program: procurement_quest<br>Bytes: 48K<br><br>Press any key to begin...</div>
  </div>

  <div id="game-area" style="display:none;">
    <div id="header-bar">PROCUREMENT QUEST - A Civil Service Adventure</div>
    <div id="phase-bar">PHASE: PLAN</div>
    <div id="story-text"></div>
    <div id="choices-area"></div>
    <div id="stats-bar">
      <span id="stat-morale">MORALE: ████████ 100%</span>
      <span id="stat-budget">BUDGET: &pound;50M</span>
      <span id="stat-compliance">COMPLIANCE: ██████ 80%</span>
      <span id="stat-tea">TEA: ██████████ HOT</span>
    </div>
  </div>
</div>

<script>
// ============================================
// PROCUREMENT QUEST: A Civil Service Adventure
// Based on the UK Government Sourcing Playbook
// & Procurement Pathway
// ============================================

const TITLE_ART = `
 ####  ####   ###   ###  #  #  ####  #### #   # #### #  # #####
 #   # #   # #   # #   # #  #  #   # #    ## ## #    ## #   #
 ####  ####  #   # #     #  #  ####  ###  # # # ###  # ##   #
 #     #  #  #   # #   # #  #  #  #  #    #   # #    #  #   #
 #     #   #  ###   ###   ##   #   # #### #   # #### #  #   #

             Q   U   E   S   T
`;

// Game state
let state = {
  morale: 100,
  budget: 50,
  compliance: 80,
  tea: 100,
  phase: 'PLAN',
  currentNode: 'start',
  history: [],
  flags: {},
  teaCups: 0,
  acronymsUsed: 0,
  consultantsBriefed: 0,
  meetingsAttended: 0
};

// ============================================
// GAME STORY NODES
// ============================================
const nodes = {

// ==========================================
// INTRO
// ==========================================
start: {
  phase: 'PLAN',
  text: `<span class="highlight">MONDAY MORNING. 08:47.</span>
<span class="info">Department of Administrative Efficiency</span>
<span class="info">Marsham Street, London SW1</span>

You are <span class="highlight">Pat Procurement</span>, newly promoted Grade 7 Commercial Officer at the Department of Administrative Efficiency (DAE).

Your Director-General bursts in, coffee stain on their lanyard, and announces:

<span class="warning">"We need to procure a new National Biscuit Distribution System. The current one was last updated in 2003 and still runs on Microsoft Access. The Minister wants it done by April. God help us all."</span>

They leave. You stare at your monitor. The Procurement Pathway stares back.

<span class="dim">Your tea is getting cold.</span>`,
  choices: [
    { text: '[1] Open the Procurement Pathway and begin with PLAN phase', next: 'plan_pipeline' },
    { text: '[2] Make a fresh cup of tea first (priorities)', next: 'first_tea' },
    { text: '[3] Check if "Biscuit Distribution" is actually in scope', next: 'scope_check' }
  ]
},

first_tea: {
  phase: 'PLAN',
  text: `You head to the kitchen. The kettle takes 3 minutes. You use this time wisely to contemplate the enormity of government procurement.

<span class="success">TEA STATUS: REFRESHED</span>
<span class="info">+10 MORALE | Tea cups consumed: 1</span>

The kitchen whiteboard reads: <span class="dim">"47 DAYS WITHOUT A PROCUREMENT INCIDENT"</span>

Feeling fortified, you return to your desk. A Post-it note has appeared: <span class="warning">"Check the commercial pipeline - DG"</span>

Right. The Sourcing Playbook says you need to start with the <span class="highlight">Commercial Pipeline</span>. Policy 1 of 11. Only 10 more to go.`,
  onEnter: (s) => { s.morale = Math.min(100, s.morale + 10); s.tea = 100; s.teaCups++; },
  choices: [
    { text: '[1] Check the commercial pipeline for biscuit-related contracts', next: 'plan_pipeline' },
    { text: '[2] Email the DG asking what "by April" actually means', next: 'ask_april' }
  ]
},

scope_check: {
  phase: 'PLAN',
  text: `You spend 45 minutes trying to determine whether "Biscuit Distribution" falls under Category Tower 7 (Food & Catering) or Category Tower 12 (IT & Digital).

You email Legal. Legal emails Policy. Policy emails Legal back. Everyone CCs everyone.

<span class="warning">-5 MORALE | +1 Meeting scheduled</span>

Eventually your line manager replies:

<span class="info">"It's both. The biscuits are physical but the distribution system is digital. Congratulations, you now need TWO sourcing strategies. Or one very creative one."</span>

The Procurement Act 2023 documentation does not have a specific section on biscuit distribution. You are <span class="highlight">in uncharted territory</span>.`,
  onEnter: (s) => { s.morale -= 5; s.meetingsAttended++; },
  choices: [
    { text: '[1] Start with the commercial pipeline (play it safe)', next: 'plan_pipeline' },
    { text: '[2] Attempt the creative single-strategy approach', next: 'creative_strategy' },
    { text: '[3] Make tea while you think about it', next: 'think_tea' }
  ]
},

ask_april: {
  phase: 'PLAN',
  text: `You send a carefully worded email to the DG:

<span class="dim">"Dear DG, Could you clarify the timeline requirement? When you said 'by April', did you mean: (a) Contract awarded by April, (b) Service operational by April, (c) A vague aspiration to keep the Minister happy?"</span>

The reply comes in 90 seconds:

<span class="warning">"Yes."</span>

Helpful. You make a mental note that <span class="highlight">defining the Business Need</span> (Playbook Policy 3) is going to be... interesting.

Meanwhile, your inbox has 14 new emails, 11 of which contain the word "urgent" and 3 of which are about the office microwave.`,
  onEnter: (s) => { s.morale -= 3; },
  choices: [
    { text: '[1] Ignore the inbox. Start the commercial pipeline.', next: 'plan_pipeline' },
    { text: '[2] Respond to all 14 emails first (you know you should)', next: 'email_spiral' }
  ]
},

email_spiral: {
  phase: 'PLAN',
  text: `<span class="warning">TWO HOURS LATER...</span>

You have responded to all 14 emails. This has generated 31 more emails. One of them is a meeting invite for a "Pre-Meeting Meeting" to discuss the "Biscuit Transformation Programme."

Someone has created a SharePoint site. It already has 4 folders, all empty except one containing a single PowerPoint with the title slide: <span class="dim">"National Biscuit Distribution System - DRAFT v0.1 - DO NOT CIRCULATE"</span>

It has been circulated to 47 people.

<span class="warning">-15 MORALE | +3 Meetings scheduled</span>

Your tea is <span class="warning">STONE COLD</span>.`,
  onEnter: (s) => { s.morale -= 15; s.tea = 0; s.meetingsAttended += 3; },
  choices: [
    { text: '[1] Enough. Open the Procurement Pathway. NOW.', next: 'plan_pipeline' },
    { text: '[2] Make emergency tea before proceeding', next: 'emergency_tea' }
  ]
},

emergency_tea: {
  phase: 'PLAN',
  text: `<span class="success">EMERGENCY TEA PROTOCOL ACTIVATED</span>

You march to the kitchen with the determination of someone who has read all 11 key policies of the Sourcing Playbook.

Yorkshire Tea. No sugar. Milk first (you're not a monster).

<span class="success">TEA: RESTORED | +15 MORALE</span>

In the kitchen, you overhear two G6s discussing the biscuit project:

<span class="dim">"Apparently the Minister tried to use the current system to order HobNobs for a select committee and it delivered 4,000 packets of Rich Tea to the wrong building."</span>

<span class="dim">"Classic."</span>

Right. This project genuinely matters. Back to work.`,
  onEnter: (s) => { s.morale = Math.min(100, s.morale + 15); s.tea = 100; s.teaCups++; },
  choices: [
    { text: '[1] Begin the commercial pipeline review', next: 'plan_pipeline' }
  ]
},

think_tea: {
  phase: 'PLAN',
  text: `You make tea and think. The Sourcing Playbook's <span class="highlight">Policy 1: Commercial Pipelines</span> says you should publish your pipeline for the next 18 months minimum.

As you sip, a profound thought strikes: the biscuit system IS the pipeline. It's pipelines all the way down.

<span class="success">TEA: HOT | +5 MORALE | EXISTENTIAL CRISIS: MILD</span>

Your colleague Dave from Digital pops his head round: <span class="info">"Heard you got the biscuit gig. Want me to check if GDS has any design patterns for confectionery logistics?"</span>`,
  onEnter: (s) => { s.morale += 5; s.tea = 100; s.teaCups++; },
  choices: [
    { text: '[1] Accept Dave\'s help gratefully', next: 'dave_helps' },
    { text: '[2] Politely decline - too early for Digital involvement', next: 'plan_pipeline' }
  ]
},

dave_helps: {
  phase: 'PLAN',
  text: `Dave disappears and returns 20 minutes later with:
- A GDS service assessment report from 2019 about "Biscuit-as-a-Service"
- A link to a discovery sprint that was abandoned in 2021
- Three Post-it notes that say "User Need: I need biscuits"

<span class="info">"Turns out DCMS tried this in 2019. They got to Alpha but the funding was reallocated to... something about blockchain."</span>

This is actually useful. There's prior art. The Sourcing Playbook's <span class="highlight">Policy 2: Market Health Assessment</span> requires you to assess what the market can deliver.

<span class="success">+10 COMPLIANCE | Dave added to project team</span>`,
  onEnter: (s) => { s.compliance = Math.min(100, s.compliance + 10); s.flags.dave_on_team = true; },
  choices: [
    { text: '[1] Use this intel to inform the pipeline review', next: 'plan_pipeline' },
    { text: '[2] Dig deeper into the 2019 Biscuit-as-a-Service discovery', next: 'baas_discovery' }
  ]
},

baas_discovery: {
  phase: 'PLAN',
  text: `You pull up the 2019 discovery report. It's 87 pages. The executive summary reads:

<span class="dim">"The UK Government spends approximately &pound;42M annually on biscuit-related activities across 47 departments. Distribution inefficiencies account for 23% wastage. The current system, BISCUIT-1 (Built In Sinclair Computer Using Integrated Technology, circa 2003), cannot be upgraded as the original developer has retired to Dorset and 'lost the source code.'"</span>

<span class="highlight">KEY FINDING:</span> Three suppliers were identified as capable of delivering a modern system. Two have since been acquired by the same company.

This is gold dust for your <span class="highlight">Market Health Assessment</span>.

<span class="success">+15 COMPLIANCE | Market intelligence acquired</span>`,
  onEnter: (s) => { s.compliance = Math.min(100, s.compliance + 15); s.flags.has_market_intel = true; },
  choices: [
    { text: '[1] Proceed to the pipeline review with this intelligence', next: 'plan_pipeline' }
  ]
},

creative_strategy: {
  phase: 'PLAN',
  text: `You draft a "Unified Biscuit-Digital Strategy" that combines physical distribution with digital systems under one contract.

You send it to the Commercial Director for review. The response:

<span class="warning">"This is either brilliant or career-ending. Possibly both. Have you done the Pipeline review yet? Sourcing Playbook Policy 1 exists for a reason."</span>

<span class="warning">-5 COMPLIANCE (jumped ahead of process)</span>
<span class="info">But your creative thinking has been noted...</span>`,
  onEnter: (s) => { s.compliance -= 5; s.flags.creative_thinker = true; },
  choices: [
    { text: '[1] Chastened, begin the proper pipeline review', next: 'plan_pipeline' },
    { text: '[2] Argue your case further (risky)', next: 'argue_case' }
  ]
},

argue_case: {
  phase: 'PLAN',
  text: `You compose an impassioned 2,000-word email defending your unified approach, citing precedent from the Ministry of Defence's "Sandwich and Satellite" combined procurement of 2017.

The Commercial Director replies:

<span class="warning">"That procurement took 4 years and we still don't have the sandwiches. Follow the Playbook. That's an instruction."</span>

<span class="warning">-10 MORALE | -10 COMPLIANCE</span>

Your line manager sends you a sympathetic Teams message: <span class="dim">"Just do the pipeline, Pat. We've all been there."</span>`,
  onEnter: (s) => { s.morale -= 10; s.compliance -= 10; },
  choices: [
    { text: '[1] Swallow your pride. Start the pipeline review.', next: 'plan_pipeline' }
  ]
},

// ==========================================
// PLAN PHASE - PIPELINE
// ==========================================
plan_pipeline: {
  phase: 'PLAN',
  text: `<span class="highlight">═══ PHASE 1: PLAN ═══</span>
<span class="info">COMMERCIAL PIPELINE REVIEW</span>
<span class="dim">Sourcing Playbook Policy 1: Commercial Pipelines</span>

You open the department's commercial pipeline. According to the Playbook, you should be publishing upcoming procurements for the next <span class="highlight">18 months minimum</span>, ideally 3-5 years.

The department's pipeline spreadsheet was last updated... <span class="warning">seven months ago</span>. It lists:
- "New photocopiers" (completed 2024)
- "Biscuit thing???" (added last week, by the DG apparently)
- "TBC" (no further details)

The Playbook says the market needs to be aware of upcoming projects. Currently, the market is aware of nothing.

You need to decide how to publish this pipeline.`,
  choices: [
    { text: '[1] Publish immediately on Contracts Finder (quick & compliant)', next: 'publish_pipeline_quick' },
    { text: '[2] Organise a Market Day event to brief suppliers properly', next: 'market_day' },
    { text: '[3] Update the pipeline properly first, THEN publish', next: 'update_pipeline' }
  ]
},

publish_pipeline_quick: {
  phase: 'PLAN',
  text: `You draft a pipeline notice and publish it on Contracts Finder:

<span class="info">"The Department of Administrative Efficiency intends to procure a National Biscuit Distribution System. Estimated value: &pound;45-55M. Expected publication: Q2 2025/26."</span>

Within 24 hours, your inbox contains:
- 14 expressions of interest
- 3 requests for "pre-market engagement"
- 1 email from a company called "BiscuitBlockchain Ltd"
- 1 FOI request about government biscuit expenditure

<span class="success">+10 COMPLIANCE</span> - Pipeline published!
<span class="warning">But was it too hasty?</span>

The Commercial Director notes you didn't do a <span class="highlight">Market Health Assessment</span> first. <span class="dim">Playbook Policy 2 exists for a reason, Pat.</span>`,
  onEnter: (s) => { s.compliance += 10; s.flags.published_early = true; },
  choices: [
    { text: '[1] Crack on with the Market Health Assessment', next: 'market_assessment' },
    { text: '[2] Respond to BiscuitBlockchain Ltd (curiosity wins)', next: 'biscuit_blockchain' }
  ]
},

biscuit_blockchain: {
  phase: 'PLAN',
  text: `Against your better judgement, you open the email from BiscuitBlockchain Ltd:

<span class="dim">"Dear Procurement Professional, Our patented Web3-enabled Biscuit Ledger Technology (BLT) can revolutionise your biscuit supply chain. Every HobNob tracked on an immutable distributed ledger. Rich Tea provenance guaranteed. Jaffa Cake classification disputes settled by smart contract (cake OR biscuit - let the blockchain decide)."</span>

You close the email.

<span class="dim">You will never get those 30 seconds back.</span>

<span class="warning">-2 MORALE (time wasted on nonsense)</span>

Right. <span class="highlight">Market Health Assessment</span>. Properly this time.`,
  onEnter: (s) => { s.morale -= 2; },
  choices: [
    { text: '[1] Proceed to Market Health Assessment', next: 'market_assessment' }
  ]
},

market_day: {
  phase: 'PLAN',
  text: `You organise a <span class="highlight">Market Day</span> - inviting potential suppliers to learn about the upcoming procurement.

You book a conference room. You order biscuits for the biscuit procurement market day. The irony is not lost on anyone.

<span class="info">12 suppliers attend.</span> They range from:
- Massive Global Corp PLC ("We do everything")
- Two SMEs who actually specialise in food logistics tech
- A Big 4 consultancy (there to sell consulting, obviously)
- BiscuitBlockchain Ltd (they got in somehow)

The SMEs ask brilliant questions. Massive Global Corp asks when the RFP drops. The consultancy suggests you need a "Strategic Biscuit Transformation Roadmap" before procuring anything.

<span class="success">+15 COMPLIANCE | +10 MORALE</span>
<span class="info">Excellent market engagement (Playbook Policies 1 & 2)</span>`,
  onEnter: (s) => { s.compliance += 15; s.morale += 10; s.flags.did_market_day = true; },
  choices: [
    { text: '[1] Use the market intelligence for your assessment', next: 'market_assessment' },
    { text: '[2] Commission the "Strategic Biscuit Transformation Roadmap"', next: 'consultant_trap' }
  ]
},

consultant_trap: {
  phase: 'PLAN',
  text: `You commission the Big 4 consultancy to produce a "Strategic Biscuit Transformation Roadmap."

<span class="warning">Cost: &pound;500,000</span>
<span class="warning">Timeline: 12 weeks</span>

Eight weeks later, they deliver a 200-slide PowerPoint. Slide 1: "BISCUIT TRANSFORMATION: A JOURNEY." Slide 200: "NEXT STEPS: Commission Phase 2 of this report."

The actual content can be summarised as: <span class="dim">"You need a new system. We recommend you procure one."</span>

Your DG is furious: <span class="warning">"Half a million quid to tell us what we already knew? The Consultancy Playbook exists for EXACTLY this reason!"</span>

<span class="info">14.3.5: "Critical delivery failures (defined as >100 units misdelivered) shall trigger a Root Cause Analysis within 48 hours."</span>

This is covered. Your contract drafting was thorough. You invoke both clauses.

CrumbTech complies professionally. Root cause identified (postcode bug), fix deployed, service credit applied.

<span class="success">+10 COMPLIANCE | Good contract = good outcomes</span>
<span class="info">This is why the Playbook emphasises proper contract terms.</span>`,
  onEnter: (s) => { s.compliance += 10; },
  choices: [
    { text: '[1] Proceed to the conclusion', next: 'final_chapter' }
  ]
},

// ==========================================
// FINALE
// ==========================================
final_chapter: {
  phase: 'MANAGE',
  text: `<span class="highlight">═══ ONE YEAR LATER ═══</span>

The <span class="success">National Biscuit Distribution System v2.0</span> is live across all 47 government departments.

<span class="info">FINAL KPIs:</span>
<span class="success">Delivery accuracy:          99.7%</span>
<span class="success">Next-day delivery:          98.9%</span>
<span class="success">Emergency Jaffa Cake time:  47 minutes</span>
<span class="success">User satisfaction:          4.6/5</span>
<span class="success">Cost savings vs old system: &pound;9.2M/year</span>

The Minister gives a speech: <span class="dim">"This government is delivering for the people. Even the biscuits arrive on time now."</span>

The NAO review praises the procurement as <span class="success">"a model of good practice"</span>.${state.compliance >= 80 ? '\n\n<span class="success">Your compliance score of ' + state.compliance + '% is noted approvingly.</span>' : ''}

Keith retires, finally at peace. His last act is to order 1 (one) packet of HobNobs. It arrives correctly.

<span class="dim">He sheds a single tear.</span>`,
  choices: [
    { text: '[1] View your final score', next: 'game_over' }
  ]
},

game_over: {
  phase: 'COMPLETE',
  text: `<span class="highlight">═══════════════════════════════════════</span>
<span class="highlight">    PROCUREMENT QUEST: COMPLETE!</span>
<span class="highlight">═══════════════════════════════════════</span>

<span class="info">FINAL STATISTICS:</span>

  Morale:            <span class="${state.morale >= 70 ? 'success' : 'warning'}">${state.morale}%</span>
  Budget remaining:  <span class="${state.budget >= 40 ? 'success' : 'warning'}">&pound;${state.budget}M</span>
  Compliance:        <span class="${state.compliance >= 80 ? 'success' : 'warning'}">${state.compliance}%</span>
  Tea consumed:      <span class="info">${state.teaCups} cups</span>
  Meetings attended: <span class="dim">${state.meetingsAttended}</span>
  Consultants used:  <span class="${state.consultantsBriefed === 0 ? 'success' : 'warning'}">${state.consultantsBriefed}</span>

<span class="highlight">YOUR RANK:</span> ${getRank(state)}

<span class="dim">Based on the UK Government Sourcing Playbook</span>

<span class="dim">procurementpathway.civilservice.gov.uk</span>

  choices: [
    { text: '[SPACE] Play Again', next: 'restart' }
  ]
},

restart: {
  phase: 'PLAN',
  text: '',
  onEnter: () => { resetGame(); }
}

};

// ============================================
// HELPER FUNCTIONS
// ============================================

function getRank(s) {
  const score = s.compliance + s.morale + (s.budget * 2) + (s.teaCups * 5);
  if (score >= 350) return '<span class="success">PERMANENT SECRETARY OF PROCUREMENT</span>\nYou are a legend. The Sourcing Playbook should be renamed after you.';
  if (score >= 280) return '<span class="success">SENIOR COMMERCIAL DIRECTOR</span>\nExcellent work. The NAO approves. Have a biscuit.';
  if (score >= 220) return '<span class="info">GRADE 6 COMMERCIAL LEAD</span>\nSolid procurement professional. Room for improvement, but who hasn\'t accidentally hired a consultant?';
  if (score >= 160) return '<span class="highlight">GRADE 7 COMMERCIAL OFFICER</span>\nYou survived. That\'s the main thing. Read the Playbook again.';
  if (score >= 100) return '<span class="warning">HIGHER EXECUTIVE OFFICER</span>\nThe PVR panel remembers you. Not fondly. More tea needed.';
  return '<span class="warning">EXECUTIVE OFFICER (PROBATION)</span>\nThe NAO has questions. Many questions. Your DG would like a word.';
}

function resetGame() {
  state = {
    morale: 100,
    budget: 50,
    compliance: 80,
    tea: 100,
    phase: 'PLAN',
    currentNode: 'start',
    history: [],
    flags: {},
    teaCups: 0,
    acronymsUsed: 0,
    consultantsBriefed: 0,
    meetingsAttended: 0
  };
  showNode('start');
}

// ============================================
// RENDERING ENGINE
// ============================================

function updateStats() {
  const moraleBar = '█'.repeat(Math.max(0, Math.floor(state.morale / 10))) + '░'.repeat(Math.max(0, 10 - Math.floor(state.morale / 10)));
  const complianceBar = '█'.repeat(Math.max(0, Math.floor(state.compliance / 10))) + '░'.repeat(Math.max(0, 10 - Math.floor(state.compliance / 10)));
  const teaBar = state.tea >= 80 ? 'HOT' : state.tea >= 40 ? 'WARM' : 'COLD';
  const teaColour = state.tea >= 80 ? 'success' : state.tea >= 40 ? 'highlight' : 'warning';

  document.getElementById('stat-morale').innerHTML = `MORALE: ${moraleBar} ${state.morale}%`;
  document.getElementById('stat-budget').innerHTML = `BUDGET: &pound;${state.budget}M`;
  document.getElementById('stat-compliance').innerHTML = `COMPLIANCE: ${complianceBar} ${state.compliance}%`;
  document.getElementById('stat-tea').innerHTML = `TEA: <span class="${teaColour}">${teaBar}</span>`;
}

function showNode(nodeId) {
  if (nodeId === 'restart') {
    resetGame();
    return;
  }

  const node = nodes[nodeId];
  if (!node) return;

  state.currentNode = nodeId;
  state.history.push(nodeId);

  if (node.onEnter) {
    node.onEnter(state);
  }

  if (node.phase) {
    state.phase = node.phase;
    const phaseBar = document.getElementById('phase-bar');
    const phaseColours = {
      'PLAN': 'background: #002bfb; color: #ffffff;',
      'DEFINE': 'background: #d62816; color: #fffc36;',
      'PROCURE': 'background: #00c525; color: #000;',
      'MANAGE': 'background: #d433ff; color: #ffffff;',
      'COMPLETE': 'background: #fffc36; color: #000;'
    };
    phaseBar.style.cssText = phaseColours[node.phase] || '';
    phaseBar.textContent = `PHASE: ${node.phase}`;
  }

  // Render story text with typewriter-ish effect
  const storyEl = document.getElementById('story-text');
  storyEl.innerHTML = node.text;
  storyEl.scrollTop = 0;

  // Render choices
  const choicesEl = document.getElementById('choices-area');
  choicesEl.innerHTML = '';

  node.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = choice.text;
    btn.addEventListener('click', () => {
      // Decrease tea over time
      state.tea = Math.max(0, state.tea - 15);
      showNode(choice.next);
    });
    choicesEl.appendChild(btn);
  });

  // Keyboard shortcuts
  const keyHandler = (e) => {
    const num = parseInt(e.key);
    if (num >= 1 && num <= node.choices.length) {
      document.removeEventListener('keydown', keyHandler);
      state.tea = Math.max(0, state.tea - 15);
      showNode(node.choices[num - 1].next);
    }
    if (e.key === ' ' && nodeId === 'game_over') {
      document.removeEventListener('keydown', keyHandler);
      resetGame();
    }
  };
  document.removeEventListener('keydown', window._lastKeyHandler);
  window._lastKeyHandler = keyHandler;
  document.addEventListener('keydown', keyHandler);

  updateStats();
}

// ============================================
// LOADING SCREEN
// ============================================

function showLoadingScreen() {
  const titleEl = document.getElementById('title-art');
  titleEl.textContent = TITLE_ART;

  const container = document.getElementById('loading-stripes-container');
  const colours = ['#ff331c', '#ff331c', '#00fbfe', '#00fbfe', '#ff40ff', '#ff40ff', '#00f92f', '#00f92f',
                   '#ff331c', '#00fbfe', '#ff40ff', '#00f92f', '#fffc36', '#fffc36', '#002bfb', '#002bfb'];

  colours.forEach((colour, i) => {
    const stripe = document.createElement('div');
    stripe.className = 'loading-stripes';
    stripe.style.backgroundColor = colour;
    stripe.style.animationDelay = `${i * 0.1}s`;
    stripe.style.animationFillMode = 'forwards';
    container.appendChild(stripe);
  });

  const startGame = () => {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('game-area').style.display = 'flex';
    showNode('start');
    document.removeEventListener('keydown', startGame);
    document.getElementById('loading-screen').removeEventListener('click', startGame);
  };

  document.addEventListener('keydown', startGame);
  document.getElementById('loading-screen').addEventListener('click', startGame);
}

// ============================================
// INIT
// ============================================
window.addEventListener('DOMContentLoaded', showLoadingScreen);
</script>
</body>
</html>
